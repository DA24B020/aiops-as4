global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - recording_rules.yml
  - alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: caption_app
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          app: image-captioning

  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["localhost:9093"]
